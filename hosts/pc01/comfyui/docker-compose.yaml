# Based on https://github.com/YanWenKun/ComfyUI-Docker/blob/main/rocm/docker-compose.yml

name: comfyui
services:
  comfyui:
    init: true
    container_name: comfyui
    image: yanwk/comfyui-boot:rocm
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      # The ComfyUI install, custom nodes and settings.
      - storage:/root
      # Kept apart so wiping the install does not delete 7 GB of models.
      - models:/root/ComfyUI/models
      # pre-start.sh runs before every ComfyUI start and installs what nodes.json
      # and models.curl list. 
      - ./pre-start.sh:/root/user-scripts/pre-start.sh
      - ./nodes.json:/root/user-scripts/nodes.json:ro
      - ./models.curl:/root/user-scripts/models.curl:ro
      # Extra model lists kept out of git (local/ is gitignored).
      - ./local:/root/user-scripts/local:ro
    environment:
      # HACK: on ROCm, copying mmap-backed safetensors to the GPU runs at ~2 MB/s
      # (measured), so make ComfyUI load models into normal RAM first.
      # https://github.com/Comfy-Org/ComfyUI/issues/15001
      # Remove once ROCm fixes it: https://github.com/ROCm/rocm-systems/pull/15545
      - CLI_ARGS=--disable-mmap
    # The rest is as the image's author recommends for ROCm.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - label:disable

  # Unloads models from VRAM after ComfyUI has been idle, so Ollama can have the GPU.
  vram-free:
    container_name: comfyui-vram-free
    image: curlimages/curl
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./vram-free.sh:/vram-free.sh:ro
    entrypoint: ["sh", "/vram-free.sh"]
    depends_on:
      - comfyui

volumes:
  storage:
    name: comfyui-storage
  models:
    name: comfyui-models
